name: Deploy Website

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install dependencies
          run: npm install

        - name: Build the website
          run: npm run build

        - name: Print current time
          run: date

        # Previews live on gh-pages too, so clean everything except them.
        - name: Deploy to gh-pages branch
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            branch: gh-pages
            folder: dist
            clean: true
            clean-exclude: pr-previews/

permissions:
  contents: write