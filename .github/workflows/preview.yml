name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build-and-preview:
    # Fork PRs get a read-only token, so they can't deploy.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build the website
        run: |
          npm ci
          npx --no-install astro build --base "/pr-previews/$PR/"
          node .github/scripts/rebase-preview.mjs dist "/pr-previews/$PR/"

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: pr-previews/${{ github.event.pull_request.number }}
          commit-message: Deploy preview for PR ${{ github.event.pull_request.number }}

      - name: Comment preview URL
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** https://nishagoswami.com/pr-previews/$PR/ (built from $HEAD_SHA)"

  delete-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview
        run: |
          git rm -r --quiet --ignore-unmatch "pr-previews/$PR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet || git commit -m "Remove preview for PR $PR"
          git push

      - name: Update comment
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview removed:** this PR is closed."
